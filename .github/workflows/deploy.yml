name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Never cancel a production Pages deploy mid-flight; the next push queues behind it.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      # setup-bun caches only the bun executable; cache the package downloads too.
      - name: Cache Bun package downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun1.4.0-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run ui:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/ui

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Above deploy-pages' own 10-minute wait, so the job is not killed first.
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
